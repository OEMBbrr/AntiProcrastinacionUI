<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sitio Bloqueado - AntiProcrastinación</title>
    <style>
        body {
            background-color: #0F171E;
            color: #F1F5F9;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 1px solid #5A6E61;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.8rem;
            color: #F1F5F9;
            margin-bottom: 12px;
        }
        p {
            color: #94A3B8;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .badge {
            background: rgba(90, 110, 97, 0.25);
            color: #8C9B90;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="app_logo.jpg" alt="Logo" class="logo">
        <div class="badge">SITIO BLOQUEADO EN MODO ENFOQUE</div>
        <h1>Mantén tu Concentración</h1>
        <p>Este sitio web ha sido bloqueado por <strong>AntiProcrastinación</strong> para proteger tu tiempo de enfoque. Abre la extensión si necesitas realizar un desafío de verificación para desbloquear.</p>
    </div>
</body>
</html>

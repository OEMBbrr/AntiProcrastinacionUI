name: Build iOS Application (iPhone .IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar App para iPhone (Servidores Mac de GitHub)
    runs-on: macos-14
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Obtener dependencias de Flutter
        run: flutter pub get

      - name: Generar estructura oficial Xcode para iOS
        run: flutter create . --project-name antiprocrastinacion --platforms=ios --org com.antiprocrastinacion

      - name: Compilar ejecutable para iPhone
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/ 2>/dev/null || true
          cd build/ios/iphoneos && zip -r AntiProcrastinacion_iOS.ipa Payload

      - name: Subir ejecutable para iPhone (.ipa / Runner.app)
        uses: actions/upload-artifact@v4
        with:
          name: AntiProcrastinacion_iOS_v1
          path: |
            build/ios/iphoneos/*.ipa
            build/ios/iphoneos/Runner.app
